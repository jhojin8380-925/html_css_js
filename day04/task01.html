<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input 이벤트 실습</title>
    <script defer src="./js/task01.js"></script>
</head>
<body>
    <form action="">
        <h2>focus, blur</h2>
        <label for="">
            <span>text1:</span>
            <input type="text" name="text1" class="text1">
        </label>
        <div class="text-focus"></div>
        <h2>키보드에서 손을 때면 발생!</h2>
        <label for="">
            <span>text2:</span>
            <input type="text" name="text2" class="text2">
        </label>
        <div class="text-inner"></div>
        <h2>쇼핑카트</h2>
        <label for="">
            <span>과자</span>
            <input type="radio" name="snack" value="과자" class="food">
        </label>
        <label for="">
            <span>콜라</span>
            <input type="radio" name="snack" value="콜라" class="food">
        </label>
        <label for="">
            <span>사이다</span>
            <input type="radio" name="snack" value="사이다" class="food">
        </label>
        <div class="select-food"></div>
        
    </form>
</body>
</html>
