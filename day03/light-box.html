<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라이트 박스1</title>
    <link rel="stylesheet" href="./css/light-box.css">
    <!-- <script defer src = "./js/light-box.js"></script> -->
    <script defer src="./js/light-box2.js"></script>
</head>
<body>
    <main>
        <div class="img-box">
            <!-- data 속성 -->
             <!-- data-src 속성 활용함
              data속성은 data-로 시작함
              개발자가 필요한 데이터를 저장하는 속성 -->
            <button
                data-src="https://cdn.pixabay.com/photo/2023/01/22/15/16/ocean-7736669_640.jpg"
                class = 'test-img' type = "button"> 이미지1
            </button>
        </div>
        <div class="img-box">
            <button 
                data-src="https://cdn.pixabay.com/photo/2022/09/02/11/43/wall-7427386_1280.jpg"
                class = 'test-img' type = "button"> 이미지2 
            </button>
        </div>
        <div class="img-box">
            <button 
            data-src="https://cdn.pixabay.com/photo/2023/01/08/16/29/sea-7705679_1280.jpg"
            class = 'test-img' type = "button"> 이미지3
            </button>
        </div>

        <div class="img-box">
            <button 
                data-src="https://cdn.pixabay.com/photo/2023/02/04/09/20/castle-7766794_960_720.jpg" 
                type="button" > 이미지4
            </button>
        </div>
        <div class="img-box">
            <button 
                data-src="https://cdn.pixabay.com/photo/2013/11/28/10/03/river-219972_960_720.jpg" 
                type="button" > 이미지5
            </button>
        </div>

        <div class = "big-img-wrap">
            <div class="big-img-box">
                <img src="" alt="" class = "big-img">
            </div>
        </div>
    </main>
</body>
</html>
