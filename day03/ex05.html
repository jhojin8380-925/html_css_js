<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키 이벤트</title>
</head>
<body>
    <input type="text" name = "name" placeholder="이름 입력하세요!">
    <p id = "name"></p>
</body>
<script>
    const name = document.querySelector("input[name = 'name']");
    const p = document.querySelector("#name");
    
//키보드를 누르고 땟을 때 (keyup) : 이벤트를 발생시키면
// 글자가 입력되고 나서 발생되기 때문에 글자를 잘 가져온다
// 키 다운

    name.addEvnetListener("keyup", (e) => {
        p.innerText = e.target.value;
        console.log(e.target);
    });
    
</script>
</html>
