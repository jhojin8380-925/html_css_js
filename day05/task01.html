<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계절별 이미지 배너 만들기!</title>
    <link rel="stylesheet" href="./css/task01.css">
    <script defer src="./js/task01.js"></script>
    <script
        src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
        crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1 class="header-text">Header</h1>
        <nav>
            
        </nav>
    </header>
    <main>
        <!-- 슬라이드 화면 -->
        <div class="slide-main">
            <h1 class="slide-text">계절별 이미지 배너 만들기</h1>
            <ul class="slide-ul">
                <li class="slide-li">
                    <img src="./img/spring.jpg" alt="봄" class="slide-img">
                </li>
                <li class="slide-li">
                    <img src="./img/summer.jpg" alt="여름" class="slide-img">
                </li>
                <li class="slide-li">
                    <img src="./img/autumn.jpg" alt="가을" class="slide-img">
                </li>
                <li class="slide-li">
                    <img src="./img/winter.jpg" alt="겨울" class="slide-img">
                </li>
            </ul>
            <!-- 베너 버튼 -->
            <div class="prev">&lt</div>
            <div class="next">&gt</div>
        </div>
    </main>
</body>
</html>
