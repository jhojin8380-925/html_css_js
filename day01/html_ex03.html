<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alert/confirm</title>
</head>
<body>
    
</body>
<script>
    let msg = "";
    if(confirm("결제하시겠습니까?")){
        // 예를 선택할 경우
        alert("결제완료");
        msg = "결제완료";
    }else{
        // 아니요를 선택할 경우
        alert("결제취소!");
        msg = "결제취소";
    }

    document.write(`<h1>${msg}</h1>`)
</script>
</html>
