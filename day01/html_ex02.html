<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입력 대화 상자</title>
</head>
<body></body>
<script>
    let name = prompt("이름을 입력하세요!");
    // prompt로 입력받은 문자열을 변수에 저장
    // document.write("<h1>" + name + "</h1>"); 
    document.write(`<h1>${name}</h1>`)
    console.log(name); // 브라우저 콘솔 창에 출력
    
    
</script> 
</html>
